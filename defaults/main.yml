---
fabos_grafana_image: grafana/grafana
fabos_grafana_version: latest
fabos_grafana_project_name: grafana
fabos_grafana_project_dir: /opt/grafana
fabos_grafana_compose_file: docker-compose.yml
fabos_grafana_config_dir: "{{ fabos_grafana_project_dir }}"
fabos_grafana_dashboard_dir: "{{ fabos_grafana_config_dir }}/dashboards/role-managed"
fabos_grafana_container_uid: 472
fabos_grafana_container_gid: 472
fabos_grafana_data_volume_name: "{{ fabos_grafana_project_name }}-data"
fabos_grafana_http_port: 3000
fabos_grafana_restart_policy: unless-stopped
fabos_grafana_pull_policy: missing
fabos_grafana_remove_orphans: false
fabos_grafana_admin_user: admin
fabos_grafana_admin_password: ""
fabos_grafana_plugins: []
fabos_grafana_environment: {}
fabos_grafana_datasources: []
fabos_grafana_delete_datasources: []
fabos_grafana_datasource_prune: false
fabos_grafana_dashboard_providers: []
fabos_grafana_dashboards: {}
fabos_grafana_alerting:
  alert_rules: []
  delete_rules: []
  contact_points: []
  delete_contact_points: []
  notification_policies: []
  reset_policies: []
  templates: []
  delete_templates: []
  mute_timings: []
  delete_mute_timings: []

# Loki (optional, deployed in the same Compose project as Grafana)
fabos_grafana_loki_enabled: false
fabos_grafana_loki_image: grafana/loki
fabos_grafana_loki_version: latest
fabos_grafana_loki_publish_port: true
fabos_grafana_loki_http_port: 3100
fabos_grafana_loki_container_uid: 10001
fabos_grafana_loki_container_gid: 10001
fabos_grafana_loki_data_volume_name: "{{ fabos_grafana_project_name }}-loki-data"
fabos_grafana_loki_retention_period: 744h
fabos_grafana_loki_config_overrides: {}
# Base URL of an external Loki. Only used when Loki is not deployed by this role
# (for example, Alloy-only deployments). Ignored when fabos_grafana_loki_enabled is true.
fabos_grafana_loki_url: ""

# Grafana Alloy (optional, deployed in the same Compose project as Grafana)
fabos_grafana_alloy_enabled: false
fabos_grafana_alloy_image: grafana/alloy
fabos_grafana_alloy_version: latest
fabos_grafana_alloy_data_volume_name: "{{ fabos_grafana_project_name }}-alloy-data"
fabos_grafana_alloy_host_log_dirs:
  - /var/log
# Each target is an Alloy file target: "__path__" is a glob, other keys become Loki labels.
fabos_grafana_alloy_file_targets:
  - __path__: /var/log/*log
    job: varlogs
    host: "{{ inventory_hostname }}"
# Raw Alloy configuration appended to the generated config. Forward logs to
# loki.write.default.receiver to send them to the configured Loki.
fabos_grafana_alloy_extra_config: ""
# Raw Alloy configuration that replaces the generated config entirely when non-empty.
fabos_grafana_alloy_config: ""
# Collect the logs of all Docker containers on the host. This mounts the Docker socket
# read-only into Alloy, which grants it root-equivalent access to the host.
fabos_grafana_alloy_docker_logs_enabled: false
fabos_grafana_alloy_docker_socket: /var/run/docker.sock
# Value of the "host" label on collected Docker container log streams.
fabos_grafana_alloy_docker_logs_host: "{{ inventory_hostname }}"

# Built-in dashboards, provisioned separately from fabos_grafana_dashboards
fabos_grafana_docker_logs_dashboard_enabled: "{{ fabos_grafana_alloy_enabled and fabos_grafana_alloy_docker_logs_enabled }}"
fabos_grafana_builtin_dashboard_folder: Docker

# Loki datasource, provisioned automatically when Loki or Alloy is enabled
fabos_grafana_loki_datasource_enabled: true
fabos_grafana_loki_datasource_name: Loki
fabos_grafana_loki_datasource_uid: loki
