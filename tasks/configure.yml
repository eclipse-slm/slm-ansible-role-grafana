---
- name: Create Grafana project directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Grafana config directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create Grafana provisioning directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Grafana dashboards directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/dashboards"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Grafana provisioning subdirectories
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - datasources
    - dashboards
    - alerting
  loop_control:
    label: "{{ item }}"

- name: Create Grafana-managed dashboard directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_dashboard_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Grafana secret directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/secrets"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write initial Grafana admin password file
  ansible.builtin.copy:
    content: "{{ fabos_grafana_admin_password }}"
    dest: "{{ fabos_grafana_config_dir }}/secrets/admin_password"
    owner: "{{ fabos_grafana_container_uid }}"
    group: "{{ fabos_grafana_container_gid }}"
    mode: "0400"
  no_log: true

- name: Build effective Grafana datasource list
  ansible.builtin.set_fact:
    _fabos_grafana_effective_datasources: >-
      {{
        fabos_grafana_datasources
        + ([_fabos_grafana_loki_datasource]
           if (fabos_grafana_loki_enabled or fabos_grafana_alloy_enabled)
              and fabos_grafana_loki_datasource_enabled
              and fabos_grafana_loki_datasource_uid not in (fabos_grafana_datasources | map(attribute='uid', default='') | list)
              and fabos_grafana_loki_datasource_name not in (fabos_grafana_datasources | map(attribute='name', default='') | list)
           else [])
      }}
  no_log: true

- name: Write Grafana datasource provisioning
  ansible.builtin.template:
    src: provisioning/datasources.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/datasources/eclipse-slm-grafana-datasources.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    _fabos_grafana_effective_datasources | length > 0
    or fabos_grafana_delete_datasources | length > 0
    or fabos_grafana_datasource_prune
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove datasource provisioning when no datasources are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/datasources/eclipse-slm-grafana-datasources.yml"
    state: absent
  when:
    - _fabos_grafana_effective_datasources | length == 0
    - fabos_grafana_delete_datasources | length == 0
    - not fabos_grafana_datasource_prune
  notify: Restart Grafana after provisioning change

- name: Write Grafana dashboard provider provisioning
  ansible.builtin.template:
    src: provisioning/dashboard-providers.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/dashboards/eclipse-slm-grafana-dashboard-providers.yml"
    owner: root
    group: root
    mode: "0640"
  when: fabos_grafana_dashboard_providers | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove dashboard provider provisioning when no providers are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/dashboards/eclipse-slm-grafana-dashboard-providers.yml"
    state: absent
  when: fabos_grafana_dashboard_providers | length == 0
  notify: Restart Grafana after provisioning change

- name: Write Grafana dashboard models
  ansible.builtin.template:
    src: provisioning/dashboard.json.j2
    dest: "{{ fabos_grafana_dashboard_dir }}/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    fabos_grafana_dashboard_model: "{{ item.value }}"
  loop: "{{ fabos_grafana_dashboards | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Find existing Grafana dashboard models
  ansible.builtin.find:
    paths: "{{ fabos_grafana_dashboard_dir }}"
    patterns: "*.json"
    file_type: file
  register: fabos_grafana_existing_dashboards

- name: Remove Grafana dashboard models no longer configured
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ fabos_grafana_existing_dashboards.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in (fabos_grafana_dashboards.keys() | list)
  notify: Restart Grafana after provisioning change

- name: Create built-in dashboard directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/builtin-dashboards"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fabos_grafana_docker_logs_dashboard_enabled

- name: Write built-in dashboard provider provisioning
  ansible.builtin.template:
    src: provisioning/builtin-dashboard-providers.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/dashboards/eclipse-slm-grafana-builtin-dashboard-providers.yml"
    owner: root
    group: root
    mode: "0640"
  when: fabos_grafana_docker_logs_dashboard_enabled
  notify: Restart Grafana after provisioning change

# Copied rather than templated: the dashboard uses Grafana's own {{label}} legend syntax.
- name: Write Docker container logs dashboard
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', 'dashboards/docker-container-logs.json')
         | replace('__FABOS_LOKI_DATASOURCE_UID__', fabos_grafana_loki_datasource_uid) }}
    dest: "{{ fabos_grafana_config_dir }}/builtin-dashboards/docker-container-logs.json"
    owner: root
    group: root
    mode: "0644"
  when: fabos_grafana_docker_logs_dashboard_enabled
  notify: Restart Grafana after provisioning change

- name: Remove built-in dashboards when they are disabled
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/{{ item }}"
    state: absent
  loop:
    - provisioning/dashboards/eclipse-slm-grafana-builtin-dashboard-providers.yml
    - builtin-dashboards
  when: not fabos_grafana_docker_logs_dashboard_enabled
  notify: Restart Grafana after provisioning change

- name: Write Grafana alert rule provisioning
  ansible.builtin.template:
    src: provisioning/alert-rules.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-alert-rules.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    fabos_grafana_alerting.get('alert_rules', []) | length > 0
    or fabos_grafana_alerting.get('delete_rules', []) | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove alert rule provisioning when no rules are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-alert-rules.yml"
    state: absent
  when:
    - fabos_grafana_alerting.get('alert_rules', []) | length == 0
    - fabos_grafana_alerting.get('delete_rules', []) | length == 0
  notify: Restart Grafana after provisioning change

- name: Write Grafana contact point provisioning
  ansible.builtin.template:
    src: provisioning/contact-points.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-contact-points.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    fabos_grafana_alerting.get('contact_points', []) | length > 0
    or fabos_grafana_alerting.get('delete_contact_points', []) | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove contact point provisioning when none are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-contact-points.yml"
    state: absent
  when:
    - fabos_grafana_alerting.get('contact_points', []) | length == 0
    - fabos_grafana_alerting.get('delete_contact_points', []) | length == 0
  notify: Restart Grafana after provisioning change

- name: Write Grafana notification policy provisioning
  ansible.builtin.template:
    src: provisioning/notification-policies.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-notification-policies.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    fabos_grafana_alerting.get('notification_policies', []) | length > 0
    or fabos_grafana_alerting.get('reset_policies', []) | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove notification policy provisioning when none are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-notification-policies.yml"
    state: absent
  when:
    - fabos_grafana_alerting.get('notification_policies', []) | length == 0
    - fabos_grafana_alerting.get('reset_policies', []) | length == 0
  notify: Restart Grafana after provisioning change

- name: Write Grafana notification template provisioning
  ansible.builtin.template:
    src: provisioning/templates.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-templates.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    fabos_grafana_alerting.get('templates', []) | length > 0
    or fabos_grafana_alerting.get('delete_templates', []) | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove notification template provisioning when none are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-templates.yml"
    state: absent
  when:
    - fabos_grafana_alerting.get('templates', []) | length == 0
    - fabos_grafana_alerting.get('delete_templates', []) | length == 0
  notify: Restart Grafana after provisioning change

- name: Write Grafana mute timing provisioning
  ansible.builtin.template:
    src: provisioning/mute-times.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-mute-times.yml"
    owner: root
    group: root
    mode: "0640"
  when: >-
    fabos_grafana_alerting.get('mute_timings', []) | length > 0
    or fabos_grafana_alerting.get('delete_mute_timings', []) | length > 0
  no_log: true
  notify: Restart Grafana after provisioning change

- name: Remove mute timing provisioning when none are configured
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/provisioning/alerting/eclipse-slm-grafana-mute-times.yml"
    state: absent
  when:
    - fabos_grafana_alerting.get('mute_timings', []) | length == 0
    - fabos_grafana_alerting.get('delete_mute_timings', []) | length == 0
  notify: Restart Grafana after provisioning change

- name: Create Loki config directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/loki"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fabos_grafana_loki_enabled

- name: Write Loki configuration
  ansible.builtin.template:
    src: loki/loki-config.yml.j2
    dest: "{{ fabos_grafana_config_dir }}/loki/loki-config.yml"
    owner: root
    group: root
    mode: "0644"
  when: fabos_grafana_loki_enabled
  notify: Restart Loki after configuration change

- name: Remove Loki configuration when Loki is disabled
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/loki/loki-config.yml"
    state: absent
  when: not fabos_grafana_loki_enabled

- name: Create Alloy config directory
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/alloy"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: fabos_grafana_alloy_enabled

- name: Write Alloy configuration
  ansible.builtin.template:
    src: alloy/config.alloy.j2
    dest: "{{ fabos_grafana_config_dir }}/alloy/config.alloy"
    owner: root
    group: root
    mode: "0644"
  when: fabos_grafana_alloy_enabled
  notify: Restart Alloy after configuration change

- name: Remove Alloy configuration when Alloy is disabled
  ansible.builtin.file:
    path: "{{ fabos_grafana_config_dir }}/alloy/config.alloy"
    state: absent
  when: not fabos_grafana_alloy_enabled

- name: Reset Grafana container environment map
  ansible.builtin.set_fact:
    _fabos_grafana_environment: {}
  no_log: true

- name: Build Grafana container environment
  ansible.builtin.set_fact:
    _fabos_grafana_environment: "{{ _fabos_grafana_environment | default({}) | combine({item.key: item.value | string | replace('$', '$$$$')}) }}"
  loop: >-
    {{
      fabos_grafana_environment
      | combine({
          'GF_SECURITY_ADMIN_USER': fabos_grafana_admin_user,
          'GF_INSTALL_PLUGINS': fabos_grafana_plugins | join(',')
        })
      | dict2items
    }}
  no_log: true

- name: Write Grafana Compose configuration
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ fabos_grafana_project_dir }}/{{ fabos_grafana_compose_file }}"
    owner: root
    group: root
    mode: "0640"
  no_log: true
