---
- name: Check that empty provisioning inputs render no provisioning files
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    fabos_grafana_admin_password: test-only-password
  tasks:
    - name: Create a temporary project directory
      ansible.builtin.tempfile:
        state: directory
        prefix: grafana-empty-provisioning-
      register: grafana_empty_test_directory

    - name: Configure an empty Grafana project
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: configure.yml
      vars:
        fabos_grafana_project_dir: "{{ grafana_empty_test_directory.path }}/grafana-$role-path"

    - name: Validate the generated Compose configuration with Docker Compose
      ansible.builtin.command:
        cmd: docker compose config --format json
        chdir: "{{ grafana_empty_test_directory.path }}/grafana-$role-path"
      register: grafana_empty_compose_config
      changed_when: false

    - name: Assert bind mount paths survive Compose parsing
      ansible.builtin.assert:
        that:
          - >-
            ((grafana_empty_compose_config.stdout | from_json).services.grafana.volumes
            | selectattr('target', 'equalto', '/etc/grafana/provisioning')
            | map(attribute='source') | first)
            == (grafana_empty_test_directory.path ~ '/grafana-$$role-path/provisioning')
          - >-
            ((grafana_empty_compose_config.stdout | from_json).services.grafana.volumes
            | selectattr('target', 'equalto', '/etc/grafana/dashboards')
            | map(attribute='source') | first)
            == (grafana_empty_test_directory.path ~ '/grafana-$$role-path/dashboards/role-managed')

    - name: Find generated provisioning files
      ansible.builtin.find:
        paths: "{{ grafana_empty_test_directory.path }}/grafana-$role-path/provisioning"
        patterns:
          - "*.yml"
          - "*.yaml"
        recurse: true
      register: grafana_empty_provisioning_files

    - name: Find generated dashboard models
      ansible.builtin.find:
        paths: "{{ grafana_empty_test_directory.path }}/grafana-$role-path/dashboards/role-managed"
        patterns: "*.json"
        recurse: true
      register: grafana_empty_dashboard_files

    - name: Assert empty provisioning inputs generated no files
      ansible.builtin.assert:
        that:
          - grafana_empty_provisioning_files.files | length == 0
          - grafana_empty_dashboard_files.files | length == 0

    - name: Remove the temporary project directory
      ansible.builtin.file:
        path: "{{ grafana_empty_test_directory.path }}"
        state: absent
