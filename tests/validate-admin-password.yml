---
- name: Check that the role rejects a missing admin password
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fabos_grafana_admin_password: ""
  tasks:
    - name: Expect role validation to reject the empty password
      block:
        - name: Run Grafana role validation
          ansible.builtin.import_tasks: ../tasks/validate.yml

        - name: Fail if role validation accepts an empty password
          ansible.builtin.fail:
            msg: The role accepted an empty Grafana admin password.
      rescue:
        - name: Assert the role failed for the required-password reason
          ansible.builtin.assert:
            that:
              - "'fabos_grafana_admin_password must be set' in ansible_failed_result.msg"
            fail_msg: "Unexpected validation result: {{ ansible_failed_result.msg }}"
