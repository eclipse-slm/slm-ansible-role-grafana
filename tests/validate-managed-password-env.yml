---
- name: Check that the admin password cannot be overridden through extra environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    fabos_grafana_admin_password: test-only-password
    fabos_grafana_environment:
      GF_SECURITY_ADMIN_PASSWORD: accidental-override
  tasks:
    - name: Expect role validation to reject the duplicate password setting
      block:
        - name: Run Grafana role validation
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
            tasks_from: validate.yml

        - name: Fail if role validation accepts the duplicate password setting
          ansible.builtin.fail:
            msg: The role accepted GF_SECURITY_ADMIN_PASSWORD in the extra environment map.
      rescue:
        - name: Assert the role failed for the managed-password reason
          ansible.builtin.assert:
            that:
              - "'GF_SECURITY_ADMIN_PASSWORD is managed by the role' in ansible_failed_result.msg"
            fail_msg: "Unexpected validation result: {{ ansible_failed_result.msg }}"
