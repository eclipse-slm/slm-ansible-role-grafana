---
_fabos_grafana_loki_internal_url: http://loki:3100
_fabos_grafana_loki_effective_url: >-
  {{ _fabos_grafana_loki_internal_url if fabos_grafana_loki_enabled | bool else fabos_grafana_loki_url | regex_replace('/+$', '') }}

_fabos_grafana_loki_base_config:
  auth_enabled: false
  server:
    http_listen_port: 3100
    grpc_listen_port: 9096
    log_level: info
  common:
    instance_addr: 127.0.0.1
    path_prefix: /loki
    storage:
      filesystem:
        chunks_directory: /loki/chunks
        rules_directory: /loki/rules
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
  schema_config:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: "{{ fabos_grafana_loki_retention_period }}"
  compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false

_fabos_grafana_loki_datasource:
  name: "{{ fabos_grafana_loki_datasource_name }}"
  uid: "{{ fabos_grafana_loki_datasource_uid }}"
  type: loki
  access: proxy
  url: "{{ _fabos_grafana_loki_effective_url }}"
  isDefault: false
  editable: false
